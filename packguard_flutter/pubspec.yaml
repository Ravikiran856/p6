name: packguard
description: >
  PackGuard — AI-driven malicious-package detection with
  risk visualization for open-source Python packages (Android).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.2
  google_sign_in: ^6.2.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  shimmer: ^3.0.0

  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
