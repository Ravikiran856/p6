name: Build PackGuard Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Platform & Gradle Wrapper
        working-directory: ./packguard_flutter
        run: |
          mkdir -p /tmp/packguard_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/packguard_backup/AndroidManifest.xml || true
          cp android/app/google-services.json /tmp/packguard_backup/google-services.json || true
          
          rm -rf android
          flutter create . --platforms=android --org=com.packguard --project-name=packguard
          
          if [ -f /tmp/packguard_backup/AndroidManifest.xml ]; then
            cp /tmp/packguard_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/packguard_backup/google-services.json ]; then
            cp /tmp/packguard_backup/google-services.json android/app/google-services.json
          fi

          # Ensure minSdkVersion is at least 23 for Firebase compatibility
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Install Dependencies
        working-directory: ./packguard_flutter
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./packguard_flutter
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packguard-release-apk
          path: packguard_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
